name: testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # pywebview precisa de interface gráfica; os testes usam um substituto
      - run: pip install requests pymupdf numpy -r requirements-dev.txt
      - run: pytest -q
