name: testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # pywebview precisa de interface gráfica; os testes usam um substituto. O resto do requirements.txt entra
      # (0.67: lasio, openpyxl, dlisio e xlrd faltavam, e os testes de perfis e planilhas nem eram coletados)
      - run: pip install requests pymupdf numpy dlisio lasio xlrd openpyxl -r requirements-dev.txt
      - run: pytest -q -m "not interface"
