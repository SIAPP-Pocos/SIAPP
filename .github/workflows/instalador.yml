name: instalador

# 0.67: monta o instalador do Windows (SIAPP-<versão>-instalador.exe) numa máquina Windows do GitHub.
# Roda à mão (Actions › instalador › Run workflow) ou ao criar uma etiqueta vX.Y.Z. O .exe fica em "Artifacts" da
# execução (30 dias).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Bibliotecas
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Versão
        id: versao
        shell: python
        run: |
          import os, re
          v = re.search(r'__version__ = "([^"]+)"', open("motor/__init__.py", encoding="utf-8").read()).group(1)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"versao={v}\n")
          n = [int(x) for x in v.split(".")] + [0]
          texto = open("instalador/versao.modelo.txt", encoding="utf-8").read()
          texto = texto.replace("{V4}", ", ".join(str(x) for x in n[:4])).replace("{V}", v)
          open("instalador/versao.txt", "w", encoding="utf-8").write(texto)
      - name: PyInstaller (dist/SIAPP)
        run: pyinstaller instalador/siapp.spec --noconfirm --distpath dist --workpath build
      - name: Conferir o pacote (SIAPP.exe --verificar)
        shell: pwsh
        run: |
          $env:SIAPP_DADOS = "$env:RUNNER_TEMP\siapp-dados"
          $p = Start-Process -FilePath "dist\SIAPP\SIAPP.exe" -ArgumentList "--verificar" -Wait -PassThru
          Copy-Item "$env:SIAPP_DADOS\verificar.json" verificar.json -ErrorAction SilentlyContinue
          Get-Content verificar.json -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "SIAPP.exe --verificar falhou ($($p.ExitCode))" }
      - name: Conferir a janela (SIAPP.exe --verificar-janela)
        shell: pwsh
        timeout-minutes: 5
        run: |
          $env:SIAPP_DADOS = "$env:RUNNER_TEMP\siapp-dados"
          $p = Start-Process -FilePath "dist\SIAPP\SIAPP.exe" -ArgumentList "--verificar-janela" -Wait -PassThru
          Copy-Item "$env:SIAPP_DADOS\verificar-janela.json" verificar-janela.json -ErrorAction SilentlyContinue
          Get-Content verificar-janela.json -ErrorAction SilentlyContinue
          Get-Content "$env:SIAPP_DADOS\ambiente_teste\*.log" -ErrorAction SilentlyContinue | Select-Object -Last 40
          if ($p.ExitCode -ne 0) { throw "SIAPP.exe --verificar-janela falhou ($($p.ExitCode))" }
      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DVersao=${{ steps.versao.outputs.versao }}" instalador\siapp.iss
          Get-ChildItem dist\*.exe | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }
      - name: Testar o instalador (instala, abre e desinstala, sem perguntas)
        shell: pwsh
        timeout-minutes: 8
        run: |
          $setup = Get-ChildItem dist\SIAPP-*-instalador.exe | Select-Object -First 1
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "o instalador saiu com $($p.ExitCode)" }
          $exe = "$env:LOCALAPPDATA\Programs\SIAPP\SIAPP.exe"
          if (-not (Test-Path $exe)) { throw "não achei $exe" }
          $atalho = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter "SIAPP.lnk" | Select-Object -First 1
          if (-not $atalho) { throw "o atalho do menu Iniciar não foi criado" }
          $env:SIAPP_DADOS = "$env:RUNNER_TEMP\siapp-instalado"
          $p = Start-Process -FilePath $exe -ArgumentList "--verificar-janela" -Wait -PassThru
          Get-Content "$env:SIAPP_DADOS\verificar-janela.json" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "o SIAPP instalado não abriu a janela ($($p.ExitCode))" }
          $p = Start-Process -FilePath "$env:LOCALAPPDATA\Programs\SIAPP\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          Start-Sleep -Seconds 3
          if (Test-Path $exe) { throw "a desinstalação deixou o SIAPP.exe" }
          "instalou, abriu e desinstalou: ok"
      - uses: actions/upload-artifact@v4
        with:
          name: SIAPP-${{ steps.versao.outputs.versao }}-instalador
          path: dist/SIAPP-*-instalador.exe
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verificar-${{ steps.versao.outputs.versao }}
          path: |
            verificar.json
            verificar-janela.json
