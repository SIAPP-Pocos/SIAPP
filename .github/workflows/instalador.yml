name: instalador

# 0.67: monta o instalador do Windows (SIAPP-<versão>-instalador.exe) numa máquina Windows do GitHub.
# Roda à mão (Actions › instalador › Run workflow) ou ao criar uma etiqueta vX.Y.Z. O .exe fica em "Artifacts" da
# execução (30 dias).
# Assinatura digital (SignPath, ver CODE_SIGNING_POLICY.md e docs/instalador.md): só com etiqueta vX.Y.Z e com o
# segredo SIGNPATH_API_TOKEN e a variável SIGNPATH_ORGANIZATION_ID configurados no repositório. Cada envio espera a
# aprovação à mão no site do SignPath (o SIAPP.exe e, depois, o instalador). Sem o segredo, sai sem assinatura.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write          # só para anexar o instalador à versão (Release) quando a etiqueta vX.Y.Z chega

jobs:
  windows:
    runs-on: windows-latest
    env:
      ASSINAR: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.SIGNPATH_API_TOKEN != '' && 'sim' || 'nao' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Bibliotecas
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Versão
        id: versao
        shell: python
        run: |
          import os, re
          v = re.search(r'__version__ = "([^"]+)"', open("motor/__init__.py", encoding="utf-8").read()).group(1)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"versao={v}\n")
          n = [int(x) for x in v.split(".")] + [0]
          texto = open("instalador/versao.modelo.txt", encoding="utf-8").read()
          texto = texto.replace("{V4}", ", ".join(str(x) for x in n[:4])).replace("{V}", v)
          open("instalador/versao.txt", "w", encoding="utf-8").write(texto)
      - name: PyInstaller (dist/SIAPP)
        run: pyinstaller instalador/siapp.spec --noconfirm --distpath dist --workpath build
      - name: Conferir o pacote (SIAPP.exe --verificar)
        shell: pwsh
        run: |
          $env:SIAPP_DADOS = "$env:RUNNER_TEMP\siapp-dados"
          $p = Start-Process -FilePath "dist\SIAPP\SIAPP.exe" -ArgumentList "--verificar" -Wait -PassThru
          Copy-Item "$env:SIAPP_DADOS\verificar.json" verificar.json -ErrorAction SilentlyContinue
          Get-Content verificar.json -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "SIAPP.exe --verificar falhou ($($p.ExitCode))" }
      - name: Conferir a janela (SIAPP.exe --verificar-janela)
        shell: pwsh
        timeout-minutes: 5
        run: |
          $env:SIAPP_DADOS = "$env:RUNNER_TEMP\siapp-dados"
          $p = Start-Process -FilePath "dist\SIAPP\SIAPP.exe" -ArgumentList "--verificar-janela" -Wait -PassThru
          Copy-Item "$env:SIAPP_DADOS\verificar-janela.json" verificar-janela.json -ErrorAction SilentlyContinue
          Get-Content verificar-janela.json -ErrorAction SilentlyContinue
          Get-ChildItem $env:SIAPP_DADOS -Recurse -Filter siapp.log -ErrorAction SilentlyContinue | Get-Content | Select-Object -Last 40
          if ($p.ExitCode -ne 0) { throw "SIAPP.exe --verificar-janela falhou ($($p.ExitCode))" }
      - name: "Assinatura 1/2: enviar o SIAPP.exe ao SignPath"
        id: exe-sem-assinatura
        if: env.ASSINAR == 'sim'
        uses: actions/upload-artifact@v4
        with:
          name: SIAPP-exe-sem-assinatura
          path: dist/SIAPP/SIAPP.exe
          retention-days: 1
      - name: "Assinatura 1/2: esperar a aprovação no SignPath (SIAPP.exe)"
        if: env.ASSINAR == 'sim'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'SIAPP' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: programa
          github-artifact-id: ${{ steps.exe-sem-assinatura.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 14400
          output-artifact-directory: assinado/programa
      - name: "Assinatura 1/2: conferir e usar o SIAPP.exe assinado"
        if: env.ASSINAR == 'sim'
        shell: pwsh
        run: |
          $s = Get-AuthenticodeSignature assinado\programa\SIAPP.exe
          "$($s.Status) · $($s.SignerCertificate.Subject)"
          if ($s.Status -ne 'Valid') { throw "a assinatura do SIAPP.exe não é válida ($($s.Status))" }
          Copy-Item assinado\programa\SIAPP.exe dist\SIAPP\SIAPP.exe -Force
      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DVersao=${{ steps.versao.outputs.versao }}" instalador\siapp.iss
          Get-ChildItem dist\*.exe | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }
      - name: "Assinatura 2/2: separar o instalador"
        if: env.ASSINAR == 'sim'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force para-assinar | Out-Null
          Copy-Item "dist\SIAPP-${{ steps.versao.outputs.versao }}-instalador.exe" para-assinar\instalador.exe
      - name: "Assinatura 2/2: enviar o instalador ao SignPath"
        id: instalador-sem-assinatura
        if: env.ASSINAR == 'sim'
        uses: actions/upload-artifact@v4
        with:
          name: SIAPP-instalador-sem-assinatura
          path: para-assinar/instalador.exe
          retention-days: 1
      - name: "Assinatura 2/2: esperar a aprovação no SignPath (instalador)"
        if: env.ASSINAR == 'sim'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'SIAPP' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: instalador
          github-artifact-id: ${{ steps.instalador-sem-assinatura.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 14400
          output-artifact-directory: assinado/instalador
      - name: "Assinatura 2/2: conferir e usar o instalador assinado"
        if: env.ASSINAR == 'sim'
        shell: pwsh
        run: |
          $s = Get-AuthenticodeSignature assinado\instalador\instalador.exe
          "$($s.Status) · $($s.SignerCertificate.Subject)"
          if ($s.Status -ne 'Valid') { throw "a assinatura do instalador não é válida ($($s.Status))" }
          Copy-Item assinado\instalador\instalador.exe "dist\SIAPP-${{ steps.versao.outputs.versao }}-instalador.exe" -Force
      - name: Testar o instalador (instala, abre e desinstala, sem perguntas)
        shell: pwsh
        timeout-minutes: 8
        run: |
          $setup = Get-ChildItem dist\SIAPP-*-instalador.exe | Select-Object -First 1
          $dados = "$env:RUNNER_TEMP\Pasta escolhida no instalador"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/PASTADADOS=`"$dados`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "o instalador saiu com $($p.ExitCode)" }
          $exe = "$env:LOCALAPPDATA\Programs\SIAPP\SIAPP.exe"
          if (-not (Test-Path $exe)) { throw "não achei $exe" }
          foreach ($a in @($setup.FullName, $exe)) { "assinatura de {0}: {1}" -f (Split-Path $a -Leaf), (Get-AuthenticodeSignature $a).Status }
          if ($env:ASSINAR -eq 'sim' -and (Get-AuthenticodeSignature $exe).Status -ne 'Valid') { throw "o SIAPP.exe instalado não está assinado" }
          $atalho = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter "SIAPP.lnk" | Select-Object -First 1
          if (-not $atalho) { throw "o atalho do menu Iniciar não foi criado" }
          "pasta_dados.txt: " + (Get-Content "$env:LOCALAPPDATA\Programs\SIAPP\pasta_dados.txt" -Raw)
          Remove-Item Env:SIAPP_DADOS -ErrorAction SilentlyContinue
          # sem SIAPP_DADOS: o SIAPP instalado tem de usar a pasta escolhida no instalador
          $p = Start-Process -FilePath $exe -ArgumentList "--verificar-janela" -Wait -PassThru
          Get-Content "$dados\verificar-janela.json" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "o SIAPP instalado não abriu a janela ($($p.ExitCode))" }
          if (-not (Test-Path "$dados\verificar-janela.json")) { throw "o SIAPP não usou a pasta escolhida no instalador" }
          $p = Start-Process -FilePath "$env:LOCALAPPDATA\Programs\SIAPP\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          Start-Sleep -Seconds 3
          if (Test-Path $exe) { throw "a desinstalação deixou o SIAPP.exe" }
          "instalou, abriu e desinstalou: ok"
      - name: "Código-fonte junto (AGPL: quem recebe o instalador tem direito ao código)"
        shell: pwsh
        run: git archive --format=zip --prefix=SIAPP-${{ steps.versao.outputs.versao }}/ -o "dist\SIAPP-${{ steps.versao.outputs.versao }}-codigo-fonte.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: SIAPP-${{ steps.versao.outputs.versao }}-instalador
          path: |
            dist/SIAPP-*-instalador.exe
            dist/SIAPP-*-codigo-fonte.zip
          retention-days: 30
      - name: O que mudou (trecho do CHANGELOG desta versão)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: python
        run: |
          import re
          v = "${{ steps.versao.outputs.versao }}"
          texto = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## \[" + re.escape(v) + r"\][^\n]*\n(.*?)(?=^## \[|\Z)", texto, re.S | re.M)
          corpo = m.group(1).strip() if m else "Ver CHANGELOG.md."
          corpo += ("\n\n---\n**Instalar:** baixe `SIAPP-" + v + "-instalador.exe` abaixo e dê dois cliques. Para atualizar, "
                    "instale por cima da versão anterior: os projetos continuam onde estão.")
          open("notas-da-versao.md", "w", encoding="utf-8").write(corpo)
      - name: Anexar à versão (só com etiqueta vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.versao.outputs.versao }}"
          $tag = "${{ github.ref_name }}"
          if ($tag -ne "v$v") { throw "a etiqueta $tag não bate com a versão $v de motor/__init__.py" }
          $arquivos = @("dist\SIAPP-$v-instalador.exe", "dist\SIAPP-$v-codigo-fonte.zip")
          $existe = @(gh release list --limit 100 --json tagName --jq ".[].tagName") -contains $tag
          if ($existe) {
            gh release upload $tag @arquivos --clobber
            # a versão criada no site sem texto ganha o trecho do CHANGELOG
            $texto = gh release view $tag --json body --jq ".body"
            if (-not $texto -or $texto.Trim().Length -lt 3) { gh release edit $tag --notes-file notas-da-versao.md }
          }
          else { gh release create $tag @arquivos --title "SIAPP $v" --notes-file notas-da-versao.md }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verificar-${{ steps.versao.outputs.versao }}
          path: |
            verificar.json
            verificar-janela.json
