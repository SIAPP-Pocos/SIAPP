name: Relatar erro
description: Algo não funcionou como deveria no SIAPP.
title: "[erro] "
labels: ["tipo: erro", "triagem"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por relatar! Quanto mais exato, mais rápido dá para corrigir.
        **Não anexe arquivos baixados do REATE**: informe o poço e o caminho do arquivo no portal.
  - type: input
    id: versao
    attributes:
      label: Versão do SIAPP
      description: Aparece em Ajuda › Sobre e no título da janela.
      placeholder: "1.1.0"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Onde aconteceu
      options:
        - Instalação, abertura ou atualização
        - Início e projetos
        - 1 Acervo (catálogo, download, levantamento)
        - 2 Documentos (PDF, TIF, OCR, transcrição)
        - 3 Perfis (DLIS, LIS, LAS, avaliação)
        - 4 Poços (mapa, ficha)
        - 5 Correlação (seção estratigráfica)
        - 6 Modelo 3D
        - Viabilidade
        - Comunidade
        - Outro
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Passo a passo para repetir o erro
      placeholder: |
        1. Abrir 1 Acervo › Catálogo do REATE, bacia Potiguar
        2. Abrir o poço 7-GMR-13-RN
        3. ...
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que você esperava e o que aconteceu
    validations:
      required: true
  - type: textarea
    id: diagnostico
    attributes:
      label: Diagnóstico
      description: Em Ajuda › Diagnóstico, clique em **Copiar para enviar** e cole aqui (versões, pasta, últimos erros).
      render: text
  - type: textarea
    id: imagens
    attributes:
      label: Capturas de tela (opcional)
      description: Arraste imagens para cá.
