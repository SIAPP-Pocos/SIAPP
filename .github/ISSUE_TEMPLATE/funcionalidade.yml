name: Sugerir melhoria
description: Uma ideia para o SIAPP fazer algo novo ou fazer melhor.
title: "[ideia] "
labels: ["tipo: funcionalidade", "triagem"]
body:
  - type: markdown
    attributes:
      value: Ideias são bem-vindas! Conte o problema antes da solução; às vezes já existe um jeito de fazer.
  - type: textarea
    id: problema
    attributes:
      label: Qual problema isso resolve?
      description: A tarefa que hoje é difícil, lenta ou impossível.
    validations:
      required: true
  - type: textarea
    id: proposta
    attributes:
      label: Como você imagina a solução
  - type: textarea
    id: exemplo
    attributes:
      label: Exemplo real
      description: Bacia, poço ou tipo de arquivo onde isso faria diferença.
